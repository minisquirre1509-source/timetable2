<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주간 시간표</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f8ff;--card:#f9fcff;--line:#d6e8f7;--ink:#2f5a7a;--sub:#6f95b0;--hatch:#e0eefb;--pt:#5aa9e6;
--c-math:#b9dcf8;--c-eng:#d4eafc;--c-kor:#c9d6f7;--c-phy:#c6ecdf;--c-chem:#dcd3f5;--c-earth:#bfe9ee;--x0:#cfe3f7;--x1:#d9e2fa;--x2:#c7eaf0;--x3:#d3f0e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14222e;--card:#1b2d3b;--line:#2c4558;--ink:#e3f1fb;--sub:#8fb5cf;--hatch:#223748;--pt:#4a93cc;
--c-math:#3f6f93;--c-eng:#355d7c;--c-kor:#46598f;--c-phy:#3e7d6d;--c-chem:#5a5190;--c-earth:#3a7783;--x0:#3b6485;--x1:#45558a;--x2:#387483;--x3:#3d7a68}}
:root[data-theme="dark"]{--bg:#14222e;--card:#1b2d3b;--line:#2c4558;--ink:#e3f1fb;--sub:#8fb5cf;--hatch:#223748;--pt:#4a93cc;
--c-math:#3f6f93;--c-eng:#355d7c;--c-kor:#46598f;--c-phy:#3e7d6d;--c-chem:#5a5190;--c-earth:#3a7783;--x0:#3b6485;--x1:#45558a;--x2:#387483;--x3:#3d7a68}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:16px 10px 28px}
h1{text-align:center;font-size:20px;margin:4px 0 12px;letter-spacing:1px}
.hint{text-align:center;font-size:12px;color:var(--sub);margin:-6px 0 10px}.hint:empty{display:none}
.card{background:var(--card);border-radius:20px;padding:10px 6px 10px 4px;box-shadow:0 6px 20px rgba(90,160,220,.18);max-width:560px;margin:0 auto}
.grid{display:grid;grid-template-columns:22px repeat(7,1fr);gap:0 3px}
.head{text-align:center;font-size:13px;padding:4px 0 8px;color:var(--sub)}
.head.we{color:#4f8fd0}
.axis,.col{position:relative;height:620px}
.axis span{position:absolute;right:3px;font-size:9px;color:var(--sub);transform:translateY(-50%)}
.col{background:linear-gradient(to bottom,transparent 19px,var(--line) 19px,var(--line) 20px,transparent 20px) 0 0/100% 40px repeat-y;border-radius:8px}
.b{position:absolute;left:1px;right:1px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;line-height:1.2;text-align:center;overflow:hidden;border:1px solid rgba(255,255,255,.6);cursor:pointer}
.b small{font-size:8px;color:var(--sub);margin-top:1px}
.school{background:repeating-linear-gradient(135deg,var(--hatch) 0,var(--hatch) 5px,transparent 5px,transparent 10px);color:var(--sub);border:1px dashed var(--line);cursor:default}
.수학{background:var(--c-math)}.영어{background:var(--c-eng)}.국어{background:var(--c-kor)}.생명{background:var(--c-phy)}.화학{background:var(--c-chem)}.세계사{background:var(--c-earth)}
.ac{border:1.5px solid var(--pt)}.x0{background:var(--x0)}.x1{background:var(--x1)}.x2{background:var(--x2)}.x3{background:var(--x3)}
.bar{display:flex;gap:8px;justify-content:center;margin:14px 0 0}
button,select,input{font:inherit;color:var(--ink)}
.btn{border:0;border-radius:999px;padding:9px 16px;background:var(--pt);color:#fff;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(20,50,80,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.row label{width:42px;font-size:13px;color:var(--sub)}
.row select,.row input{flex:1;min-width:0;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px 50px}
.chip{border:0;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.err{color:#d6457d;font-size:12px;min-height:16px;margin:0 0 6px 50px}
.acts{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<h1 id="h1">💙 주간 시간표 💙</h1>
<p class="hint" id="hint"></p>
<div class="card"><div class="grid" id="g"></div></div>
<div class="bar" id="bv"><button class="btn" id="edit">시간표 수정하기</button></div>
<div class="bar" id="be" style="display:none"><button class="btn" id="add">+ 일정 추가</button><button class="btn ghost" id="reset">이전으로 되돌리기</button><button class="btn" id="done">완료</button></div>

<div class="ov" id="ov"><div class="sheet">
<h2 id="ttl">일정 수정</h2>
<div class="row"><label>요일</label><select id="fd"></select></div>
<div class="row"><label>과목</label><input id="fn" maxlength="8" placeholder="과목 이름"></div>
<div class="chips" id="chips"></div>
<div class="row"><label>시작</label><select id="fs"></select></div>
<div class="row"><label>끝</label><select id="fe"></select></div>
<p class="err" id="err"></p>
<div class="acts"><button class="btn ghost" id="del">삭제</button><button class="btn ghost" id="cx">취소</button><button class="btn" id="ok">저장</button></div>
</div></div>

<script>
var DAYS=['월','화','수','목','금','토','일'],NAMES=['수학','영어','국어','생명','화학','세계사'];
var DEF=[[0,18,20,'수학'],[0,22,24,'세계사'],[1,20,22,'영어학원'],[1,22,24,'화학'],[2,18,19,'영어'],[2,19,20.5,'세계사'],[2,20.5,22,'생명'],[2,22,24,'화학'],[3,20,22,'영어학원'],[3,22,24,'화학'],[4,18,20,'수학'],[4,22,24,'생명'],[5,10,11.5,'영어학원'],[5,12,13.5,'수학'],[5,16.5,18,'영어'],[5,18,20,'국어'],[5,20,22,'세계사'],[5,22,24,'화학'],[6,9,10.5,'국어'],[6,10.5,12,'영어'],[6,13,15,'수학'],[6,15,17,'영어'],[6,18,20,'생명'],[6,20,22,'화학']
].map(function(a){return {d:a[0],s:a[1],e:a[2],n:a[3]}});
var KEY='tt-blue-v2',S;
function load(){try{var v=localStorage.getItem(KEY);if(v){var p=JSON.parse(v);if(Array.isArray(p))return p}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
var H=40,o=8.5;
function f(h){if(h>=24)return '밤 12시';var m=Math.round((h%1)*60),k=Math.floor(h);return (k<12?'오전 ':'오후 ')+(k>12?k-12:k)+'시'+(m?' '+m+'분':'')}
function t(h){var m=Math.round((h%1)*60),k=Math.floor(h);k=k>12?k-12:k;return k+(m?':'+(m<10?'0':'')+m:'')}
function cls(n){var a=n.slice(-2)==='학원';if(a)n=n.slice(0,-2);if(NAMES.indexOf(n)>-1)return n+(a?' ac':'');var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%4;return 'x'+h}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
 var h='<div class="head"></div>';
 DAYS.forEach(function(d,i){h+='<div class="head'+(i>4?' we':'')+'">'+d+'</div>'});
 var ax='';for(var x=9;x<=24;x++)ax+='<span style="top:'+((x-o)*H)+'px">'+(x>12?x-12:x)+'</span>';
 h+='<div class="axis">'+ax+'</div>';
 for(var d=0;d<7;d++){
  var c='';
  if(d<5)c+='<div class="b school" style="top:0;height:'+(8.5*H)+'px">학교</div>';
  S.forEach(function(s,i){if(s.d!==d)return;
   c+='<div class="b '+cls(s.n)+'" data-i="'+i+'" style="top:'+((s.s-o)*H+1)+'px;height:'+((s.e-s.s)*H-2)+'px">'+esc(s.n)+'<small>'+t(s.s)+'-'+t(s.e)+'</small></div>'});
  h+='<div class="col">'+c+'</div>';
 }
 document.getElementById('g').innerHTML=h;
}
function $(i){return document.getElementById(i)}
var cur=-1,mode=0;
(function(){
 var a='',b='';DAYS.forEach(function(d,i){a+='<option value="'+i+'">'+d+'요일</option>'});$('fd').innerHTML=a;
 for(var h=8.5;h<=24;h+=0.25)b+='<option value="'+h+'">'+f(h)+'</option>';
 $('fs').innerHTML=b;$('fe').innerHTML=b;
 var c='';NAMES.forEach(function(n){c+='<button type="button" class="chip '+n+'" data-n="'+n+'">'+n+'</button>'});['수학학원','영어학원','국어학원'].forEach(function(n){c+='<button type="button" class="chip '+cls(n)+'" data-n="'+n+'">'+n+'</button>'});$('chips').innerHTML=c;
})();
function open(i,d){
 cur=i;$('err').textContent='';
 var s=i>=0?S[i]:{d:d||0,s:18,e:20,n:''};
 $('ttl').textContent=i>=0?'일정 수정':'일정 추가';
 $('fd').value=s.d;$('fn').value=s.n;$('fs').value=s.s;$('fe').value=s.e;
 $('del').style.display=i>=0?'':'none';
 $('ov').classList.add('on');
}
function close(){$('ov').classList.remove('on')}
$('g').addEventListener('click',function(e){var b=e.target.closest('.b[data-i]');if(mode&&b)open(+b.getAttribute('data-i'))});
$('add').onclick=function(){open(-1)};function setMode(m){mode=m;$('bv').style.display=m?'none':'';$('be').style.display=m?'flex':'none';$('hint').textContent=m?'칸을 누르면 수정할 수 있어요':'';$('h1').textContent=m?'💙 시간표 수정 💙':'💙 주간 시간표 💙';window.scrollTo(0,0)}$('edit').onclick=function(){setMode(1)};$('done').onclick=function(){setMode(0)};
$('cx').onclick=close;
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))close()});
$('chips').addEventListener('click',function(e){var n=e.target.getAttribute('data-n');if(n)$('fn').value=n});
$('ok').onclick=function(){
 var n=$('fn').value.trim(),s=parseFloat($('fs').value),e=parseFloat($('fe').value),d=+$('fd').value;
 if(!n){$('err').textContent='과목 이름을 입력해 주세요';return}
 if(e<=s){$('err').textContent='끝나는 시간이 시작보다 늦어야 해요';return}
 var it={d:d,s:s,e:e,n:n};
 snap();if(cur>=0)S[cur]=it;else S.push(it);
 save();render();close();
};
$('del').onclick=function(){if(cur>=0){snap();S.splice(cur,1);save();render()}close()};
var HK=KEY+'-h',HS=[];try{HS=JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){}function snap(){HS.push(JSON.stringify(S));if(HS.length>30)HS.shift();try{localStorage.setItem(HK,JSON.stringify(HS))}catch(e){}}var RT='이전으로 되돌리기';$('reset').onclick=function(){if(!HS.length){$('reset').textContent='되돌릴 내용이 없어요';setTimeout(function(){$('reset').textContent=RT},1500);return}S=JSON.parse(HS.pop());try{localStorage.setItem(HK,JSON.stringify(HS))}catch(e){}save();render()};
render();
</script>
</body>
</html>
